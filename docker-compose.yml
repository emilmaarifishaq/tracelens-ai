services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tracelens:tracelens@postgres:5432/tracelens
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      DECODED_DIR: /data/decoded
    volumes:
      - trace_data:/data
      - ./packages:/workspace/packages:ro
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracelens
      POSTGRES_PASSWORD: tracelens
      POSTGRES_DB: tracelens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  trace_data:
  postgres_data:

