diameter:
  "5001":
    name: DIAMETER_ERROR_USER_UNKNOWN
    severity: critical
    root_cause: The subscriber identity is unknown to the Diameter peer.
    recommended_checks:
      - Verify IMSI/SUPI provisioning in HSS/UDM.
      - Check realm routing and Diameter peer selection.
      - Confirm the subscriber belongs to the queried network or roaming partner.
  "5003":
    name: DIAMETER_ERROR_IDENTITY_NOT_REGISTERED
    severity: critical
    root_cause: The identity is known but not registered for the requested service.
    recommended_checks:
      - Check subscriber registration state.
      - Verify service profile and access restrictions.
  "5004":
    name: DIAMETER_ERROR_ROAMING_NOT_ALLOWED
    severity: critical
    root_cause: The subscriber is not allowed to roam on this network.
    recommended_checks:
      - Check roaming agreement and subscriber roaming flags.
      - Verify visited-network policy and HSS/UDM subscription data.
  "5005":
    name: DIAMETER_ERROR_UNKNOWN_EPS_SUBSCRIPTION
    severity: critical
    root_cause: The HSS/UDM does not have an EPS subscription for this subscriber.
    recommended_checks:
      - Verify EPS/packet-data subscription is enabled.
      - Check APN profile assignment and subscriber package.

gtpv2_c:
  "64":
    name: Context Not Found
    severity: critical
    root_cause: The peer could not find the referenced session or tunnel context.
    recommended_checks:
      - Check TEID and sequence correlation against earlier session messages.
      - Confirm the session was not already deleted or timed out.
      - Inspect peer node logs around the reported frame.
  "65":
    name: Invalid Message Format
    severity: critical
    root_cause: The peer rejected the message because mandatory fields or encoding are invalid.
    recommended_checks:
      - Validate the request IE layout against 3GPP expectations.
      - Check vendor interop issues or malformed optional IEs.
  "66":
    name: Version Not Supported
    severity: critical
    root_cause: The peer does not support the received GTP protocol version.
    recommended_checks:
      - Verify interface protocol version configuration on both peers.
      - Check whether traffic is reaching the intended node.
  "68":
    name: Service Not Supported
    severity: critical
    root_cause: The receiving node does not support the requested service or procedure.
    recommended_checks:
      - Confirm the target node supports the requested procedure.
      - Check node role and interface routing.
  "72":
    name: System Failure
    severity: critical
    root_cause: The receiving node reported an internal system failure.
    recommended_checks:
      - Check node health, overload, and application logs.
      - Verify whether the failure is repeated for other subscribers.
      - Inspect alarms around the trace timestamp.
  "73":
    name: No Resources Available
    severity: critical
    root_cause: The receiving node could not allocate required resources for the session.
    recommended_checks:
      - Check capacity, license, and pool utilization on the peer node.
      - Verify whether the condition affects one APN/DNN or all traffic.
  "93":
    name: APN Access Denied
    severity: critical
    root_cause: The subscriber or network policy does not allow access to the requested APN.
    recommended_checks:
      - Verify the subscriber APN profile in HSS/UDM.
      - Check APN spelling and APN/DNN selection in the request.
      - Review roaming restrictions and policy-control response for this subscriber.

pfcp:
  "64":
    name: PFCP Request Rejected
    severity: critical
    root_cause: The PFCP peer rejected the request without a more specific accepted cause.
    recommended_checks:
      - Check UPF/SMF logs for the matching SEID or sequence number.
      - Verify PFCP association state and node role selection.
      - Inspect whether mandatory session rules were built before the request.
  "65":
    name: PFCP Session Context Not Found
    severity: critical
    root_cause: The peer could not find the referenced PFCP session context.
    recommended_checks:
      - Check SEID correlation against PFCP Session Establishment.
      - Confirm the session was not already deleted or timed out.
      - Verify traffic is reaching the intended UPF or SMF instance.
  "66":
    name: PFCP Mandatory IE Missing
    severity: critical
    root_cause: The PFCP request is missing a mandatory information element.
    recommended_checks:
      - Decode the PFCP message and compare IEs against the expected procedure.
      - Check SMF/UPF software compatibility and feature flags.
  "67":
    name: PFCP Conditional IE Missing
    severity: warning
    root_cause: A conditionally required PFCP information element is absent.
    recommended_checks:
      - Check whether the selected feature or rule requires additional IEs.
      - Compare with a successful trace for the same PDU session type.
  "68":
    name: PFCP Invalid Length
    severity: critical
    root_cause: The peer found an invalid PFCP information element length.
    recommended_checks:
      - Check for malformed packet encoding or vendor interop issues.
      - Inspect whether packet capture truncation affected the decode.
  "69":
    name: PFCP Mandatory IE Incorrect
    severity: critical
    root_cause: A mandatory PFCP information element is present but invalid.
    recommended_checks:
      - Validate FAR/PDR/QER/URR content in the failing request.
      - Check tunnel endpoint, precedence, and rule identifier values.
  "70":
    name: PFCP Invalid Forwarding Policy
    severity: critical
    root_cause: The selected forwarding policy is not valid on the peer.
    recommended_checks:
      - Verify forwarding policy configuration on the UPF.
      - Check SMF policy selection and slice/APN/DNN mapping.
  "72":
    name: PFCP Association Not Established
    severity: critical
    root_cause: The PFCP peer has no established association for the requested operation.
    recommended_checks:
      - Verify PFCP Association Setup completed before session messages.
      - Check node restart, heartbeat loss, firewall, and UDP 8805 reachability.
  "73":
    name: PFCP Rule Creation Or Modification Failure
    severity: critical
    root_cause: The peer failed to create or modify one or more PFCP rules.
    recommended_checks:
      - Inspect offending IE details for PDR, FAR, QER, or URR failures.
      - Check UPF resource limits and unsupported rule combinations.
  "75":
    name: PFCP No Resources Available
    severity: critical
    root_cause: The peer does not have enough resources to complete the PFCP request.
    recommended_checks:
      - Check UPF capacity, license, memory, tunnel, and rule table usage.
      - Verify whether failures affect one DNN/slice or the whole node.
  "76":
    name: PFCP Service Not Supported
    severity: critical
    root_cause: The peer does not support the requested PFCP service or feature.
    recommended_checks:
      - Check UPF capability advertisement and SMF feature selection.
      - Verify vendor interop matrix for the requested feature.
  "77":
    name: PFCP System Failure
    severity: critical
    root_cause: The peer reported an internal PFCP system failure.
    recommended_checks:
      - Check UPF/SMF health, alarms, overload state, and application logs.
      - Compare with other subscribers around the same timestamp.

dns:
  "1":
    name: DNS FormErr
    severity: warning
    root_cause: The DNS server could not interpret the query format.
    recommended_checks:
      - Check CPE DNS client behavior and resolver compatibility.
      - Inspect whether malformed or truncated DNS packets appear before the response.
  "2":
    name: DNS ServFail
    severity: warning
    root_cause: The resolver failed while processing the DNS query.
    recommended_checks:
      - Check upstream resolver reachability and health.
      - Verify recursive lookup path and authoritative DNS availability.
  "3":
    name: DNS NXDomain
    severity: warning
    root_cause: The requested DNS name does not exist according to the resolver.
    recommended_checks:
      - Verify the requested domain and DNS zone records.
      - Check whether the CPE uses the correct provisioning or ACS/FWA endpoint FQDN.
      - Compare DNS response timing with surrounding TCP or application failures.
  "4":
    name: DNS NotImp
    severity: warning
    root_cause: The resolver does not support the requested DNS operation.
    recommended_checks:
      - Check DNS query type and resolver feature support.
  "5":
    name: DNS Refused
    severity: warning
    root_cause: The resolver refused to answer the DNS query.
    recommended_checks:
      - Check resolver ACLs, source IP policy, and CPE DNS configuration.
      - Verify whether the CPE is querying the expected DNS server.

tcp:
  RST:
    name: TCP Reset
    severity: warning
    root_cause: One endpoint reset the TCP connection.
    recommended_checks:
      - Check whether the reset comes from the CPE, server, firewall, or proxy.
      - Inspect the previous frames in the same TCP stream for TLS, HTTP, or application errors.
      - Validate routing, firewall policy, and service availability for the destination.
  retransmission:
    name: TCP Retransmission
    severity: info
    root_cause: A TCP segment was retransmitted, usually because an ACK was delayed or lost.
    recommended_checks:
      - Check packet loss, latency, and asymmetric routing on the path.
      - Look for repeated retransmissions in the same TCP stream before declaring a fault.

tls:
  alert:
    name: TLS Alert
    severity: warning
    root_cause: A TLS peer reported an encrypted-session alert.
    recommended_checks:
      - Check certificate validity, SNI, TLS version, and cipher compatibility.
      - Compare the alert with the preceding Client Hello and Server Hello.

http:
  4xx:
    name: HTTP Client Error
    severity: warning
    root_cause: The server rejected the HTTP request due to request, authentication, authorization, or resource issues.
    recommended_checks:
      - Check URL, method, headers, authentication token, and client identity.
      - Verify the destination service route and application logs for the same request.
  5xx:
    name: HTTP Server Error
    severity: critical
    root_cause: The HTTP server or upstream service failed while processing the request.
    recommended_checks:
      - Check server health, upstream dependency errors, and load balancer logs.
      - Verify whether the failure is repeated across clients or isolated to this flow.
  "401":
    name: HTTP Unauthorized
    severity: warning
    root_cause: The request was not accepted because authentication is missing or invalid.
    recommended_checks:
      - Verify credentials, token lifetime, and authorization header handling.
      - Check clock sync if token validation depends on expiry timestamps.
  "403":
    name: HTTP Forbidden
    severity: warning
    root_cause: The client is authenticated or known but not permitted to access this resource.
    recommended_checks:
      - Check role, policy, tenant, APN/DNN, slice, or device entitlement.
      - Verify ACLs and application authorization logs.
  "404":
    name: HTTP Not Found
    severity: warning
    root_cause: The requested HTTP resource or route was not found.
    recommended_checks:
      - Check URL path, host header, virtual host, and service routing.
      - Verify whether the CPE or client has the correct ACS/API endpoint.
  "407":
    name: HTTP Proxy Authentication Required
    severity: warning
    root_cause: A proxy or captive gateway requires authentication before allowing the request.
    recommended_checks:
      - Check captive portal login state, proxy policy, and subscriber/session authorization.
      - Verify whether the client is expected to be redirected before internet access is granted.
      - Correlate with DNS responses and HTTP redirect Location headers in the same flow.
  "408":
    name: HTTP Request Timeout
    severity: warning
    root_cause: The server timed out waiting for the client request.
    recommended_checks:
      - Check packet loss, latency, retransmissions, and client upload behavior.
      - Inspect server timeout configuration.
  "500":
    name: HTTP Internal Server Error
    severity: critical
    root_cause: The application encountered an internal error.
    recommended_checks:
      - Check application logs and backend dependency failures.
      - Correlate the HTTP request with server-side trace or request ID.
  "502":
    name: HTTP Bad Gateway
    severity: critical
    root_cause: A gateway or proxy received an invalid response from an upstream service.
    recommended_checks:
      - Check upstream service health, DNS, TLS, and proxy configuration.
      - Verify load balancer target selection and backend port mapping.
  "503":
    name: HTTP Service Unavailable
    severity: critical
    root_cause: The service is unavailable, overloaded, draining, or temporarily blocked.
    recommended_checks:
      - Check service availability, autoscaling, maintenance, and overload alarms.
      - Verify retry-after headers and upstream capacity.
  "504":
    name: HTTP Gateway Timeout
    severity: critical
    root_cause: A gateway or proxy timed out waiting for an upstream service.
    recommended_checks:
      - Check upstream latency, routing, firewall, and dependency response time.
      - Inspect gateway timeout settings and backend saturation.

sip:
  4xx:
    name: SIP Client Failure
    severity: warning
    root_cause: The SIP request was rejected because of user, authentication, routing, or request conditions.
    recommended_checks:
      - Check IMPU/IMPI registration state, realm, route set, and subscriber service profile.
      - Inspect P-CSCF/S-CSCF logs for the same Call-ID.
  5xx:
    name: SIP Server Failure
    severity: critical
    root_cause: A SIP server failed while handling the request.
    recommended_checks:
      - Check IMS node health, overload, DNS/SRV routing, and application logs.
      - Verify whether failures affect all subscribers or one registration/dialog.
  6xx:
    name: SIP Global Failure
    severity: critical
    root_cause: The SIP request failed globally and should not be retried to another destination.
    recommended_checks:
      - Check subscriber barring, service policy, and called-party state.
      - Correlate with HSS/UDM and IMS service profile data.
  "403":
    name: SIP Forbidden
    severity: warning
    root_cause: The SIP user or request is not permitted by IMS policy.
    recommended_checks:
      - Verify subscriber IMS service profile and registration authorization.
      - Check realm, authentication vector, and P-CSCF/S-CSCF policy.
  "404":
    name: SIP Not Found
    severity: warning
    root_cause: The SIP user or route target was not found.
    recommended_checks:
      - Verify IMPU, domain, ENUM/DNS routing, and registration state.
      - Check S-CSCF assignment and user profile availability.
  "408":
    name: SIP Request Timeout
    severity: warning
    root_cause: No timely SIP response was received for the request.
    recommended_checks:
      - Check packet loss, DNS/SRV routing, firewall, and IMS node reachability.
      - Inspect retransmissions and transaction timers.
  "480":
    name: SIP Temporarily Unavailable
    severity: warning
    root_cause: The called user or service is temporarily unavailable.
    recommended_checks:
      - Check user registration state and terminating service handling.
      - Verify routing to the assigned S-CSCF/application server.
  "486":
    name: SIP Busy Here
    severity: info
    root_cause: The destination endpoint reported a busy condition.
    recommended_checks:
      - Confirm whether the busy response is expected user behavior.
      - Check call state and supplementary service configuration.
  "500":
    name: SIP Server Internal Error
    severity: critical
    root_cause: The SIP server encountered an internal error.
    recommended_checks:
      - Check IMS node logs for the Call-ID and transaction branch.
      - Inspect backend database, HSS/UDM, or application server dependency errors.
  "503":
    name: SIP Service Unavailable
    severity: critical
    root_cause: A SIP server or service is unavailable or overloaded.
    recommended_checks:
      - Check IMS node health, overload control, DNS/SRV routing, and maintenance state.
      - Verify alternate route selection and retry behavior.

dhcp:
  "6":
    name: DHCP NAK
    severity: warning
    root_cause: The DHCP server rejected the client's requested address or lease state.
    recommended_checks:
      - Check whether the requested IP belongs to the correct subnet and pool.
      - Verify CPE/client lease state, VLAN, option 82, and DHCP server binding.
      - Confirm DHCP relay path and address pool availability.

# NGAP (5G RAN-CN interface, 3GPP TS 38.413) represents Cause as a CHOICE
# across 5 categories, not a single flat code -- TraceLens looks these up by
# category (the specific cause name, e.g. "radio-resources-not-available",
# comes from the event itself and is used as the displayed error name).
ngap:
  radioNetwork:
    name: NGAP Radio Network Cause
    severity: critical
    root_cause: The RAN or UE side reported a radio-network-specific failure (resource unavailability, incompatible capability, handover condition, or similar).
    recommended_checks:
      - Check RAN-side (gNB) resource and capacity state for the cell involved.
      - Verify UE capability, QoS profile, and network slice compatibility with the requested service.
      - Check radio link quality and coverage around the reported timestamp.
    # Cause values that are routine/expected outcomes, not failures --
    # a Cause IE is present on many normal releases and handovers, not
    # only on abnormal ones, so these must not be flagged as issues.
    benign_codes: [2, 31, 32, 33]  # successful-handover, {ng-intra,ng-inter,xn}-system-handover-triggered
  transport:
    name: NGAP Transport Cause
    severity: critical
    root_cause: The transport network layer between the RAN and 5G core reported a resource or connectivity problem.
    recommended_checks:
      - Check the SCTP association health, capacity, and reachability between gNB and AMF.
      - Verify no transport-layer congestion or packet loss occurred around this frame.
  nas:
    name: NGAP NAS Cause
    severity: warning
    root_cause: The failure originated at the NAS (non-access-stratum) layer, such as authentication failure or deregistration.
    recommended_checks:
      - Check subscriber authentication and security context state in the AMF/UDM.
      - Verify the UE was not already deregistered or in an invalid mobility state.
    benign_codes: [0, 2]  # normal-release, deregister
  protocol:
    name: NGAP Protocol Cause
    severity: critical
    root_cause: The peer reported a protocol-level error while decoding or processing the message (syntax/semantic error, or message not valid for the current state).
    recommended_checks:
      - Check for message encoding or software-version mismatches between RAN and core vendors.
      - Review whether the message was sent during an unexpected procedure state.
  misc:
    name: NGAP Miscellaneous Cause
    severity: warning
    root_cause: The failure was attributed to an operational condition such as overload, hardware failure, or O&M intervention.
    recommended_checks:
      - Check AMF/gNB node health, CPU/resource overload, and O&M/maintenance activity logs around this frame.

# S1AP (4G eNB-MME interface, 3GPP TS 36.413) uses the same 5-category
# Cause structure as NGAP above.
s1ap:
  radioNetwork:
    name: S1AP Radio Network Cause
    severity: critical
    root_cause: The RAN or UE side reported a radio-network-specific failure (resource unavailability, incompatible capability, handover condition, or similar).
    recommended_checks:
      - Check RAN-side (eNB) resource and capacity state for the cell involved.
      - Verify UE capability and QoS profile compatibility with the requested service.
      - Check radio link quality and coverage around the reported timestamp.
    benign_codes: [2, 33, 34, 35]  # successful-handover, {s1-intra,s1-inter,x2}-system-handover-triggered
  transport:
    name: S1AP Transport Cause
    severity: critical
    root_cause: The transport network layer between the eNB and EPC reported a resource or connectivity problem.
    recommended_checks:
      - Check the SCTP association health, capacity, and reachability between eNB and MME.
      - Verify no transport-layer congestion or packet loss occurred around this frame.
  nas:
    name: S1AP NAS Cause
    severity: warning
    root_cause: The failure originated at the NAS layer, such as authentication failure or detach.
    recommended_checks:
      - Check subscriber authentication and security context state in the MME/HSS.
      - Verify the UE was not already detached or in an invalid mobility state.
    benign_codes: [0, 2]  # normal-release, detach
  protocol:
    name: S1AP Protocol Cause
    severity: critical
    root_cause: The peer reported a protocol-level error while decoding or processing the message (syntax/semantic error, or message not valid for the current state).
    recommended_checks:
      - Check for message encoding or software-version mismatches between RAN and core vendors.
      - Review whether the message was sent during an unexpected procedure state.
  misc:
    name: S1AP Miscellaneous Cause
    severity: warning
    root_cause: The failure was attributed to an operational condition such as overload, hardware failure, or O&M intervention.
    recommended_checks:
      - Check MME/eNB node health, CPU/resource overload, and O&M/maintenance activity logs around this frame.

radius:
  "3":
    name: RADIUS Access-Reject
    severity: critical
    root_cause: The RADIUS server explicitly rejected the access request (authentication or authorization failure).
    recommended_checks:
      - Verify the subscriber's credentials/certificate and the RADIUS shared secret configuration.
      - Check RADIUS server policy and authorization rules for this NAS/subscriber.
      - Confirm the RADIUS server is not applying a blanket deny due to an upstream directory/AAA outage.
  "42":
    name: RADIUS Disconnect-NAK
    severity: warning
    root_cause: The NAS rejected a Disconnect-Request from the RADIUS server -- the session could not be forcibly terminated as requested.
    recommended_checks:
      - Verify the session identifiers (Acct-Session-Id / User-Name) in the Disconnect-Request match an active session on the NAS.
      - Check the NAS's Dynamic Authorization Server support and shared secret.
  "45":
    name: RADIUS CoA-NAK
    severity: warning
    root_cause: The NAS rejected a Change-of-Authorization request from the RADIUS server.
    recommended_checks:
      - Verify the requested attribute changes are supported and valid for the identified session on this NAS.
      - Check the NAS's Dynamic Authorization Server support and shared secret.

# NAS-EPS (4G, 3GPP TS 24.301) and NAS-5GS (5G, 3GPP TS 24.501) only carry
# a cause IE on reject/failure message types (Attach/Registration Reject,
# Authentication Reject/Failure, TAU Reject, Service Reject, Security Mode
# Reject) -- unlike NGAP/S1AP's Cause, there's no "normal completion also
# carries a cause" case, so presence of a cause code here always means a
# real failure. The specific cause name (e.g. "MAC failure") is resolved
# in decoder.py from the real enum value and becomes the displayed name.
nas_eps:
  cause:
    name: NAS-EPS EMM Cause
    severity: critical
    root_cause: The UE or network rejected an EMM procedure (attach, authentication, tracking area update, or service request).
    recommended_checks:
      - Check subscriber provisioning, authentication vectors (Ki/OPc), and HSS state for this IMSI.
      - Verify PLMN/roaming permissions and tracking area configuration.
      - Correlate with the preceding request in the same NAS transaction to see which procedure was rejected and why.

nas_5gs:
  cause:
    name: NAS-5GS 5GMM Cause
    severity: critical
    root_cause: The UE or network rejected a 5GMM procedure (registration, authentication, or service request).
    recommended_checks:
      - Check subscriber provisioning, authentication vectors, and UDM/AUSF state for this SUPI.
      - Verify PLMN/roaming permissions, network slice (S-NSSAI), and tracking area configuration.
      - Correlate with the preceding request in the same NAS transaction to see which procedure was rejected and why.
