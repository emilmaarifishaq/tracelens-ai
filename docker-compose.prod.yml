services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: tracelens-api
    ports:
      - "8000:8000"
    environment:
      UPLOAD_DIR: /data/uploads
      DECODED_DIR: /data/decoded
      AI_PROVIDER: ${AI_PROVIDER:-rule-engine}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1/responses}
      AI_WEB_SEARCH_ENABLED: ${AI_WEB_SEARCH_ENABLED:-false}
    volumes:
      - trace_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: tracelens-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  trace_data:

networks:
  default:
    name: tracelens-network
