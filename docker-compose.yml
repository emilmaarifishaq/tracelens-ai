services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      UPLOAD_DIR: /data/uploads
      DECODED_DIR: /data/decoded
    volumes:
      - trace_data:/data

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  trace_data:
